name: Worker image (ghcr)

# Publishes the elp-worker Docker image to GitHub Container Registry.
# Triggers:
#   - tags worker-v* (e.g. worker-v1.0.0) -> that version + latest
#   - manual run (workflow_dispatch)      -> "edge" tag
#   - pushes to main touching services/worker/** -> "edge" tag

on:
  push:
    tags:
      - 'worker-v*'
    branches: [main]
    paths:
      - 'services/worker/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # 可选：配置后同步推送到阿里云 ACR（如香港区），大陆/香港服务器拉取提速。
      # 需要四个 repo secrets：
      #   ACR_REGISTRY  仓库地址，如 registry.cn-hongkong.aliyuncs.com
      #   ACR_NAMESPACE 命名空间，如 lexora
      #   ACR_USERNAME / ACR_PASSWORD 访问凭证（ACR 实例的固定密码）
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        if: env.ACR_REGISTRY != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/elp-worker"
          if [[ "${GITHUB_REF}" == refs/tags/worker-v* ]]; then
            VERSION="${GITHUB_REF_NAME#worker-v}"
            TAGS="${IMAGE}:${VERSION},${IMAGE}:latest"
          else
            # services/worker/VERSION drives releases from main: when the tag
            # worker-v<VERSION> does not exist yet, create it here and publish
            # <VERSION> + latest (sessions pushing to main cannot push tags).
            VERSION=$(cat services/worker/VERSION | tr -d '[:space:]')
            if [ -n "$VERSION" ] && ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/worker-v${VERSION}" >/dev/null 2>&1; then
              gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/worker-v${VERSION}" -f sha="${GITHUB_SHA}"
              TAGS="${IMAGE}:${VERSION},${IMAGE}:latest,${IMAGE}:edge"
            else
              TAGS="${IMAGE}:edge"
            fi
          fi
          # 配了 ACR 就把每个 ghcr tag 镜像一份过去
          if [ -n "${ACR_REGISTRY}" ] && [ -n "${ACR_NAMESPACE}" ]; then
            ACR_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/elp-worker"
            EXTRA=$(echo "$TAGS" | tr ',' '\n' | sed "s#^${IMAGE}#${ACR_IMAGE}#" | paste -sd, -)
            TAGS="${TAGS},${EXTRA}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
