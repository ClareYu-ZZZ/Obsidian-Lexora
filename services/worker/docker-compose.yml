# Lexora elp-worker — one-command self-hosting.
#
#   docker compose up -d
#   docker compose logs | grep 配对码     # 15 分钟内在 Lexora 设置里完成配对
#
# Updating:  docker compose pull && docker compose up -d
services:
  elp-worker:
    image: ghcr.io/clareyu-zzz/elp-worker:latest
    container_name: elp-worker
    restart: unless-stopped
    ports:
      - "8321:8321"
    cpus: 4
    environment:
      - LEXORA_WHISPER_THREADS=4
      # 固定 token（可选；不设则自动生成并打印，配对流程会自动取用）
      # - LEXORA_TOKEN=change-me
      # 转写模型大小：tiny/base/small/medium（默认 small）
      # - LEXORA_WHISPER_MODEL=small
      # 禁用配对端点（0 = 关闭；默认 900 秒窗口。公网共享部署务必设 0）
      # - LEXORA_PAIRING_WINDOW=900
      # 托管模式：接受 Lexora Pro license key 作为 Bearer 鉴权（与插件同一公钥离线验签）
      # 持有效 key 即可用转写/切片/TTS（按日限流）；YouTube 始终仅站长可用
      # - LEXORA_ACCEPT_LICENSE_KEYS=1
      # - LEXORA_LICENSED_DAILY_JOBS=10
      # - LEXORA_LICENSED_DAILY_TTS=300
      # 吊销（邮箱逗号分隔）： - LEXORA_REVOKED=some@user.com
    volumes:
      # faster-whisper 模型缓存 + 运维指标库（metrics.db）持久化
      - elp-worker-cache:/root/.cache
      # 托管运维：挂载签发账本后，/admin 页面显示订阅与收入（licgen 自动生成）
      # - ./issued.jsonl:/data/issued.jsonl:ro

volumes:
  elp-worker-cache:
